               <p> Twine Game:
                name: Gone Fishing
                status: Under Development
                
                Hello! I am Creating a text adventure/puzzle game in Game 160N in October of 2026. This will make it my 5th semester at PSBU. This game is still a work in progress and will continue to be developed until the end of the semester.</p>
                
                <p>Gone fishing; is a game that is created using Twine and html. The making of this game requires the use of coding and a creative mind!
                
                With twine you create a passage that contains text and parts of the story creating an interactive story. For the creation of this game we also use twines version of CSS it is very similar with few format changes. The code and CSS styling code can be found in the screen captures below!
                
                I am very excited to finish this game and to maybe one make it into something other than a text adventure.</p>
                
           <p>     This game is about a little black cat named sprout who's dream is to go fishing but he has to answer 3 riddles from trolls guarding the bridges. Will you help him?
